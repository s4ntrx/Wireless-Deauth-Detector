[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deauth-detector"
version = "0.2.0"
description = "Passive 802.11 deauthentication attack detector with spoof fingerprinting and forensic timelines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["scapy>=2.5", "rich>=13"]
keywords = ["wifi", "802.11", "deauthentication", "wireless-security", "blue-team", "ids"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deauth-detector = "deauth_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
